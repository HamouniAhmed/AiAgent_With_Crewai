<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Workflow simple de recherche d’achats avec quatre agents</title>
  <desc id="desc">La liste des produits passe successivement par un agent de requêtes, un agent de recherche web, un agent d’extraction et un agent de rapport avant la décision humaine.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#374151"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#111827}
      .title{font-size:32px;font-weight:700}
      .label{font-size:14px;font-weight:700;letter-spacing:1px;fill:#2563eb}
      .name{font-size:20px;font-weight:700}
      .detail{font-size:15px;fill:#4b5563}
      .output{font-size:14px;fill:#374151}
      .box{fill:#ffffff;stroke:#374151;stroke-width:2}
    </style>
  </defs>

  <rect width="1600" height="620" fill="#ffffff"/>
  <text x="800" y="70" text-anchor="middle" class="title">Workflow de recherche et d’aide à la décision d’achat</text>
  <line x1="150" y1="100" x2="1450" y2="100" stroke="#d1d5db"/>

  <!-- Entrée -->
  <rect x="55" y="215" width="190" height="150" rx="6" class="box" fill="#f9fafb"/>
  <text x="150" y="254" text-anchor="middle" class="label">ENTRÉE</text>
  <text x="150" y="294" text-anchor="middle" class="name">Liste des produits</text>
  <text x="150" y="327" text-anchor="middle" class="detail">Budget et critères</text>

  <!-- Agent A -->
  <rect x="310" y="195" width="220" height="190" rx="6" class="box"/>
  <rect x="310" y="195" width="220" height="42" rx="6" fill="#eff6ff"/>
  <path d="M310 231 H530" stroke="#eff6ff" stroke-width="12"/>
  <text x="420" y="222" text-anchor="middle" class="label">AGENT A</text>
  <text x="420" y="274" text-anchor="middle" class="name">Préparer les requêtes</text>
  <text x="420" y="307" text-anchor="middle" class="detail">Créer les mots-clés</text>
  <line x1="340" y1="330" x2="500" y2="330" stroke="#e5e7eb"/>
  <text x="420" y="357" text-anchor="middle" class="output">Sortie : requêtes de recherche</text>

  <!-- Agent B -->
  <rect x="590" y="195" width="220" height="190" rx="6" class="box"/>
  <rect x="590" y="195" width="220" height="42" rx="6" fill="#eff6ff"/>
  <path d="M590 231 H810" stroke="#eff6ff" stroke-width="12"/>
  <text x="700" y="222" text-anchor="middle" class="label">AGENT B</text>
  <text x="700" y="274" text-anchor="middle" class="name">Rechercher sur le Web</text>
  <text x="700" y="307" text-anchor="middle" class="detail">Outil : Tavily</text>
  <line x1="620" y1="330" x2="780" y2="330" stroke="#e5e7eb"/>
  <text x="700" y="357" text-anchor="middle" class="output">Sortie : pages produit</text>

  <!-- Agent C -->
  <rect x="870" y="195" width="220" height="190" rx="6" class="box"/>
  <rect x="870" y="195" width="220" height="42" rx="6" fill="#eff6ff"/>
  <path d="M870 231 H1090" stroke="#eff6ff" stroke-width="12"/>
  <text x="980" y="222" text-anchor="middle" class="label">AGENT C</text>
  <text x="980" y="274" text-anchor="middle" class="name">Extraire les données</text>
  <text x="980" y="307" text-anchor="middle" class="detail">Outil : ScrapeGraphAI</text>
  <line x1="900" y1="330" x2="1060" y2="330" stroke="#e5e7eb"/>
  <text x="980" y="357" text-anchor="middle" class="output">Sortie : données structurées</text>

  <!-- Agent D -->
  <rect x="1150" y="195" width="220" height="190" rx="6" class="box"/>
  <rect x="1150" y="195" width="220" height="42" rx="6" fill="#eff6ff"/>
  <path d="M1150 231 H1370" stroke="#eff6ff" stroke-width="12"/>
  <text x="1260" y="222" text-anchor="middle" class="label">AGENT D</text>
  <text x="1260" y="274" text-anchor="middle" class="name">Rédiger le rapport</text>
  <text x="1260" y="307" text-anchor="middle" class="detail">Comparer qualité / prix</text>
  <line x1="1180" y1="330" x2="1340" y2="330" stroke="#e5e7eb"/>
  <text x="1260" y="357" text-anchor="middle" class="output">Sortie : recommandation</text>

  <!-- Décision -->
  <rect x="1430" y="215" width="125" height="150" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="1492" y="254" text-anchor="middle" class="label">FINAL</text>
  <text x="1492" y="292" text-anchor="middle" class="name"><tspan x="1492">Décision</tspan><tspan x="1492" dy="25">humaine</tspan></text>
  <text x="1492" y="344" text-anchor="middle" class="detail">Choix d’achat</text>

  <!-- Flèches -->
  <path d="M245 290 H300" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M530 290 H580" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M810 290 H860" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1090 290 H1140" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1370 290 H1420" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="800" y="470" text-anchor="middle" class="detail">Flux séquentiel : chaque agent utilise la sortie de l’agent précédent.</text>
  <rect x="525" y="505" width="550" height="54" rx="4" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="800" y="538" text-anchor="middle" class="output">Objectif : sélectionner le meilleur produit selon le rapport qualité / prix.</text>
</svg>
